<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades CSS</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="cabecera">
        <h1>Unidades CSS</h1>
    </header>

    <main class="contenedor">

        <p class="texto">
            Este texto utiliza unidades <strong>rem</strong>
            para controlar su tamaño y espaciado.
        </p>

        <div class="fila">
            <div class="columna">Columna 1</div>
            <div class="columna">Columna 2</div>
        </div>

        <button class="boton">Enviar</button>
        <button class="boton boton--grande">Enviar</button>

        <div class="detalle">
            Este recuadro utiliza píxeles para el borde y la sombra.
        </div>

    </main>

</body>

</html>
